
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Riyadvi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <a class="logo" href="index.html#home">RIYADVI<span>.</span></a>
    <nav>
      <a href="index.html#home">Home</a>
      <a href="services.html">Services</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <section class="section contact" id="contact">
      <p class="eyebrow">LET'S CONNECT</p>
      <h2>Have a project in mind?</h2>

      <form id="contactForm">
        <input
          name="name"
          type="text"
          placeholder="Your name"
          required
        >

        <input
          name="email"
          type="email"
          placeholder="Your email"
          required
        >

        <textarea
          name="message"
          placeholder="Tell us about your project"
          required
        ></textarea>

        <button class="button" type="submit">Send Enquiry</button>
      </form>

      <p id="formMessage" role="status"></p>
    </section>
  </main>

  <footer>
    © 2026 Riyadvi Software Technologies · Website prototype
  </footer>

  <script src="script.js"></script>
</body>
</html>
